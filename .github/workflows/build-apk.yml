name: Build APK

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Version number
        run: echo "VER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk QuickReceive.apk
          ls -la QuickReceive.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickReceive-apk
          path: QuickReceive.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.VER }}
          name: קבלה מהירה 1.0.${{ env.VER }}
          body: |
            קבלת קבצים בשיתוף המהיר (Quick Share) של אנדרואיד – במכשיר שיודע רק לשלוח.
            הורידו את QuickReceive.apk והתקינו.
            ${{ github.event.head_commit.message }}
          files: QuickReceive.apk
          make_latest: true

      - name: Show compile errors
        if: failure()
        run: grep -E "^e: |error:|What went wrong" -A3 build.log | head -80 || true
